services:
  - type: web
    name: birthday-card
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: RECORDINGS_DIR
        value: /var/data/recordings
    disk:
      name: birthday-recordings
      mountPath: /var/data
      sizeGB: 1